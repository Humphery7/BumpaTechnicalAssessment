models:
  - name: mart_daily_orders
    description: >
      Daily order counts and amounts by date and currency. 
      Each row represents one date and currency combination. 
      Orders without a date are excluded. 
      Amounts are kept in their original currencies and should not be added together across different currencies.

    columns:
      - name: order_date
        description: Calendar day.
        data_tests:
          - not_null
      - name: currency
        description: Currency of every amount on the row.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["NGN", "KES", "GHS"]
